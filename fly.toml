app = 'runner-u7elhg'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  REPO_URL = 'https://github.com/mukeshv-tech/Taskrebulid'
  RUNNER_NAME = 'fly-runner'
  RUNNER_LABELS = 'docker,fly,linux'
  RUNNER_REPLACE = 'true'
  RUNNER_EPHEMERAL = 'false'

# GitHub Runner connects outbound to GitHub; no inbound web services or public IPs required
# Keeping [[services]] / [http_service] omitted avoids IP provisioning errors

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2048mb'
  cpus = 1

